<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aura" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Aura</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: manipulation; overscroll-behavior: none; }
    .app { position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto; background: #111; overflow: hidden; }
    .home { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; z-index: 1; pointer-events: none; user-select: none; -webkit-user-drag: none; }
    .hit-offer { position: absolute; z-index: 2; left: 7%; top: 68%; width: 36%; height: 6.5%; border: 0; background: transparent; border-radius: 999px; cursor: pointer; }
    .hit-offer:active { background: rgba(255,255,255,0.08); }
    .scrim { position: absolute; inset: 0; z-index: 3; background: rgba(30,0,50,0.35); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; width: 100%; transform: translate3d(0, 105%, 0); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); will-change: transform; pointer-events: none; }
    .sheet.open { transform: translate3d(0, 0, 0); pointer-events: auto; }
    .sheet img { display: block; width: 100%; height: auto; max-height: 85vh; object-fit: contain; object-position: bottom; user-select: none; -webkit-user-drag: none; filter: drop-shadow(0 -10px 30px rgba(0,0,0,0.4)); }
    .hit-close { position: absolute; top: 1.5%; right: 2%; width: 14%; aspect-ratio: 1; border: 0; background: transparent; border-radius: 50%; cursor: pointer; z-index: 5; }
  </style>
</head>
<body>
  <div class="app">
    <img class="home" src="home-v2.png" alt="Aura" draggable="false" />
    <button type="button" class="hit-offer" id="open" aria-label="Get Offer"></button>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <img src="sheet-v2.png" alt="Scan to Redeem" draggable="false" />
      <button type="button" class="hit-close" id="close" aria-label="Close"></button>
    </div>
  </div>
  <script>
    const sheet = document.getElementById("sheet");
    const scrim = document.getElementById("scrim");
    const open = () => { sheet.classList.add("open"); scrim.classList.add("open"); };
    const close = () => { sheet.classList.remove("open"); scrim.classList.remove("open"); };
    document.getElementById("open").addEventListener("click", open);
    document.getElementById("close").addEventListener("click", close);
    scrim.addEventListener("click", close);
  </script>
</body>
</html>
